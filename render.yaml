services:
  - type: web
    name: i-crm-workshop
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 4
      - key: NODE_OPTIONS
        value: --max-old-space-size=6144
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: i-crm-workshop
      - key: MONGODB_STATE_COLLECTION
        value: app_state
      - key: MONGODB_SESSION_COLLECTION
        value: user_sessions
      - key: MONGODB_MAX_POOL_SIZE
        value: 75
      - key: MONGODB_MIN_POOL_SIZE
        value: 10
      - key: MONGODB_PREFERENCE_COLLECTION
        value: user_preferences
      - key: MONGODB_META_CONFIG_COLLECTION
        value: meta_config
      - key: MONGODB_META_LOGS_COLLECTION
        value: meta_logs
