<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Tab</title>
  <link rel="icon" type="image/png" href="Logos/DV-Logo.png" />
  <script src="theme-bootstrap.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-body">
  <div class="layout-root">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="icrm-logo-wrap">
          <div class="icrm-text-wrap">
            <span class="icrm-logo-text">i-CRM</span>
          </div>
          <div class="icrm-dv-badge">
            <span class="icrm-dv-by">by</span>
            <img src="Logos/DV-Logo.png" alt="DV Analytics" class="icrm-dv-img" />
          </div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="pre-workshop.html" class="sidebar-link">Workshop Calling</a>
        <a href="post-workshop.html" class="sidebar-link">Admission Calling</a>
        <a href="registered-candidates.html" class="sidebar-link">Registered Candidates</a>
        <a href="main-admission-leads.html" class="sidebar-link">Main Admission Leads</a>
        <a href="task-tracker.html" class="sidebar-link" data-counselor-only="true">Task Tracker</a>
        <a href="monitoring.html" class="sidebar-link">Monitoring</a>
      </nav>
      <div class="sidebar-bottom-links" style="display:flex;flex-direction:column;gap:0;">
        <a href="counselor-management.html" class="sidebar-link sidebar-link-bottom admin-only" data-admin-only="true">Counselor Management</a>
        <a href="lead-control.html" class="sidebar-link sidebar-link-bottom admin-only" data-admin-only="true">Lead & Data Control</a>
        <a href="meta-integration.html" class="sidebar-link sidebar-link-bottom admin-only" data-admin-only="true">Meta Integration</a>
      </div>
    </aside>
    <div class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="leadTabPageTitle">Lead Tab</h1>
          <p id="leadTabPageSubtitle">Loading lead workspace...</p>
        </div>
        <div class="topbar-profile">
          <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
            <span class="theme-toggle__stack" aria-hidden="true">
              <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                  <circle cx="12" cy="12" r="4.5"></circle>
                  <path d="M12 1.8v2.4M12 19.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"></path>
                </svg>
              </span>
              <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="presentation" focusable="false">
                  <path d="M20.2 14.7A8.2 8.2 0 0 1 9.3 3.8a8.5 8.5 0 1 0 10.9 10.9Z"></path>
                </svg>
              </span>
            </span>
            <span class="theme-toggle__label" data-theme-label>Light</span>
          </button>
          <span class="role-tag" data-role-tag></span>
          <button data-logout class="btn-ghost" type="button">Log out</button>
        </div>
      </header>

      <p id="leadTabMessage" class="message" aria-live="polite"></p>
      <section class="lead-tab-shell">
        <aside id="leadTabSidebar" class="card lead-tab-sidebar"></aside>
        <section class="lead-tab-main">
          <div class="card lead-tab-card">
            <div id="leadTabActions" class="lead-tab-actions"></div>
            <div id="leadTabTabs" class="lead-tab-tabs"></div>
            <div id="leadTabPanel" class="lead-tab-panel"></div>
          </div>
        </section>
      </section>
    </div>
  </div>

  <div id="leadTabActivityModal" class="modal hidden">
    <div class="modal-content card task-modal-content">
      <h3>Update Main Admission Lead Activity</h3>
      <form id="leadTabActivityForm">
        <div class="modal-row">
          <label for="leadTabDialed">Dialed</label>
          <select id="leadTabDialed">
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <div class="modal-row">
          <label for="leadTabCoursePitched">Course Pitched</label>
          <select id="leadTabCoursePitched">
            <option value="">Select</option>
          </select>
        </div>
        <div class="modal-row">
          <label for="leadTabCourseStatus">Course Status</label>
          <select id="leadTabCourseStatus">
            <option value="">Select</option>
            <option value="Interested">Interested</option>
            <option value="Not Interested">Not Interested</option>
          </select>
        </div>
        <div class="modal-row">
          <label for="leadTabAdmissionStatus">Admission</label>
          <select id="leadTabAdmissionStatus">
            <option value="">Select</option>
            <option value="In-Conversation">In-Conversation</option>
            <option value="Opportunity">Opportunity</option>
            <option value="Offered">Offered</option>
            <option value="Enrolled">Enrolled</option>
            <option value="Won">Won</option>
          </select>
        </div>
        <div class="modal-row">
          <label for="leadTabCallStatus">Call Status</label>
          <select id="leadTabCallStatus">
            <option value="">Select</option>
            <option value="Connected">Connected</option>
            <option value="CBL">CBL</option>
            <option value="DNP">DNP</option>
            <option value="CNC">CNC</option>
          </select>
        </div>
        <div class="modal-row modal-row-span-2">
          <label for="leadTabActivityNote">Add Note</label>
          <textarea id="leadTabActivityNote" rows="3" placeholder="Optional note for this update"></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">Save</button>
          <button type="button" id="leadTabCloseActivityModalBtn" class="btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="leadTabTaskModal" class="modal hidden">
    <div class="modal-content card">
      <h3>Create Task</h3>
      <form id="leadTabTaskForm" class="task-form">
        <div class="modal-row">
          <label for="leadTabTaskLeadName">Lead</label>
          <input id="leadTabTaskLeadName" type="text" disabled />
        </div>
        <div class="modal-row">
          <label for="leadTabTaskLeadPhone">Phone Number</label>
          <input id="leadTabTaskLeadPhone" type="text" disabled />
        </div>
        <div class="modal-row">
          <label for="leadTabTaskCounselor">Counselor</label>
          <input id="leadTabTaskCounselor" type="text" disabled />
        </div>
        <div class="modal-row">
          <label for="leadTabTaskTitle">Task Title</label>
          <input id="leadTabTaskTitle" type="text" required />
        </div>
        <div class="modal-row modal-row-span-2">
          <label for="leadTabTaskNotes">Notes</label>
          <textarea id="leadTabTaskNotes" rows="4" placeholder="Optional notes"></textarea>
        </div>
        <div class="modal-row">
          <label for="leadTabTaskDueDate">Due Date &amp; Time</label>
          <input id="leadTabTaskDueDate" type="datetime-local" required />
        </div>
        <p id="leadTabTaskMessage" class="message modal-row-span-2" aria-live="polite"></p>
        <div class="modal-actions modal-row-span-2">
          <button type="submit" class="btn-primary">Create Task</button>
          <button type="button" id="leadTabCloseTaskModalBtn" class="btn-ghost">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="lead-tab.js"></script>
  <script type="module" src="layouts.js"></script>
</body>
</html>
